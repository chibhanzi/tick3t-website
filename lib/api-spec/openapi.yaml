openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: organiser
    description: Organiser profile operations
  - name: auth
    description: Account session operations
  - name: profile
    description: Authenticated user profile operations
  - name: storage
    description: Persistent object upload and serving operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /organiser/profile:
    get:
      operationId: getOrganiserProfile
      tags: [organiser]
      summary: Get the current organiser profile
      responses:
        "200":
          description: Organiser profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserProfile"
        "401":
          description: Authentication required
        "403":
          description: Organiser access required
        "404":
          description: Organiser profile has not been saved yet
    patch:
      operationId: updateOrganiserProfile
      tags: [organiser]
      summary: Update the current organiser profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganiserProfileInput"
      responses:
        "200":
          description: Updated organiser profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserProfile"
        "400":
          description: Invalid profile
        "401":
          description: Authentication required
        "403":
          description: Organiser access required
  /profile/banner:
    get:
      operationId: getProfileBanner
      tags: [profile]
      summary: Get the current user's profile banner
      responses:
        "200":
          description: Current profile banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileBanner"
        "401":
          description: Authentication required
    patch:
      operationId: updateProfileBanner
      tags: [profile]
      summary: Update the current user's profile banner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileBannerUpdate"
      responses:
        "200":
          description: Updated profile banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileBanner"
        "400":
          description: Invalid banner object
        "401":
          description: Authentication required
        "409":
          description: Banner changed in another session
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned profile banner upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
        "401":
          description: Authentication required
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a saved profile banner
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile banner image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
        "401":
          description: Authentication required
  /auth/sign-up:
    post:
      operationId: createAccount
      tags: [auth]
      summary: Create an account and signed session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid account details
        "409":
          description: Email is already registered
  /auth/sign-in:
    post:
      operationId: createSession
      tags: [auth]
      summary: Sign in and create a signed session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid credentials
  /auth/sign-out:
    delete:
      operationId: deleteSession
      tags: [auth]
      summary: Clear the current session
      responses:
        "204":
          description: Signed out
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrganiserProfileInput:
      type: object
      properties:
        bio:
          type: string
        instagram:
          type: string
        twitter:
          type: string
      required:
        - bio
        - instagram
        - twitter
    OrganiserProfile:
      allOf:
        - $ref: "#/components/schemas/OrganiserProfileInput"
    ProfileBanner:
      type: object
      properties:
        bannerPath:
          type:
            - string
            - "null"
        revision:
          type: integer
          minimum: 0
      required:
        - bannerPath
        - revision
    ProfileBannerUpdate:
      type: object
      properties:
        bannerPath:
          type:
            - string
            - "null"
        expectedRevision:
          type: integer
          minimum: 0
      required:
        - bannerPath
        - expectedRevision
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 2097152
        contentType:
          type: string
          pattern: "^image/"
      required:
        - name
        - size
        - contentType
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          minLength: 1
        objectPath:
          type: string
      required:
        - uploadURL
        - objectPath
    SignInInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72
      required: [email, password]
    SignUpInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        role:
          type: string
          enum: [user, organizer]
      required: [email, password, displayName, role]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        profilePicture:
          type: string
        isOrganizer:
          type: boolean
        isAdmin:
          type: boolean
        role:
          type: string
          enum: [user, organizer]
        isVerified:
          type: boolean
      required:
        - id
        - name
        - email
        - profilePicture
        - isOrganizer
        - isAdmin
        - role
        - isVerified

