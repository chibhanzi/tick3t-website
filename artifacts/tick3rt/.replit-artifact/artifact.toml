kind = "web"
previewPath = "/"
title = "Tick3rt"
version = "1.0.0"
id = "artifacts/tick3rt"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24122

[services.development]
run = "pnpm --filter @workspace/tick3rt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tick3rt", "run", "build" ]
serve = "static"
publicDir = "artifacts/tick3rt/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24122"
BASE_PATH = "/"
